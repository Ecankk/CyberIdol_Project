<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Idol</title>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&family=Sora:wght@400;600&display=swap" />

  <link rel="icon" href="data:;base64,=">

  <script src="/static/pixi-v6.js"></script>
  <script src="/static/live2dcubismcore.min.js"></script>
  <script src="/static/core.js"></script>
  <script src="/static/display-v4.js"></script>

  <style>
    :root {
      --bg: #050507;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-strong: rgba(255, 255, 255, 0.07);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f5fa;
      --muted: #9d9dac;
      --soft: #6d6e7d;
      --iris: #7f57ff;
      --amber: #ffb829;
      --rose: #ff5a86;
      --font-display: "Sora", "Noto Sans SC", sans-serif;
      --font-body: "Inter", "Noto Sans SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 22%, rgba(127, 87, 255, 0.16), transparent 24%),
        radial-gradient(circle at 82% 20%, rgba(255, 184, 41, 0.08), transparent 22%),
        radial-gradient(circle at 62% 82%, rgba(127, 87, 255, 0.14), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.7) 0 1px, transparent 1px),
        radial-gradient(circle at 78% 24%, rgba(127, 87, 255, 0.75) 0 1px, transparent 1px),
        radial-gradient(circle at 88% 72%, rgba(255, 184, 41, 0.75) 0 1px, transparent 1px),
        radial-gradient(circle at 28% 78%, rgba(255, 255, 255, 0.45) 0 1px, transparent 1px);
      pointer-events: none;
      opacity: 0.48;
    }

    body.state-speaking .stage-shell {
      box-shadow: 0 0 0 1px rgba(127, 87, 255, 0.2), 0 0 80px rgba(127, 87, 255, 0.16);
    }

    body.state-recording .stage-shell {
      box-shadow: 0 0 0 1px rgba(255, 90, 134, 0.24), 0 0 90px rgba(255, 90, 134, 0.14);
    }

    body.state-connected .status-dot {
      background: var(--iris);
      box-shadow: 0 0 12px rgba(127, 87, 255, 0.85);
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1420px, calc(100vw - 40px));
      height: min(920px, calc(100vh - 40px));
      margin: 20px auto;
      display: grid;
      grid-template-columns: minmax(620px, 1.3fr) minmax(360px, 0.82fr);
      gap: 20px;
    }

    .left-panel,
    .right-panel {
      min-height: 0;
    }

    .left-panel {
      display: flex;
    }

    .stage-shell {
      position: relative;
      flex: 1;
      border-radius: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.08), transparent 26%),
        radial-gradient(circle at 50% 100%, rgba(127, 87, 255, 0.2), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--line);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03);
      transition: box-shadow 0.28s ease;
    }

    .stage-grid {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      background:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to top, black 16%, transparent 100%);
      opacity: 0.14;
      pointer-events: none;
    }

    .stage-glow {
      position: absolute;
      left: 50%;
      bottom: -4%;
      width: 70%;
      height: 38%;
      transform: translateX(-50%);
      background: radial-gradient(circle at center, rgba(127, 87, 255, 0.28) 0%, rgba(127, 87, 255, 0.08) 36%, transparent 68%);
      filter: blur(14px);
      pointer-events: none;
    }

    #live2d-view {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      pointer-events: none;
    }

    .stage-top,
    .stage-bottom {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .overlay-right {
      width: 210px;
      margin-left: auto;
    }

    .glass-chip,
    .stage-card {
      background: rgba(0, 0, 0, 0.36);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .glass-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 999px;
    }

    .stage-card {
      max-width: 300px;
      padding: 14px 16px;
      border-radius: 22px;
    }

    .stage-card.overlay-right,
    .glass-chip.overlay-right {
      text-align: right;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--rose);
      box-shadow: 0 0 10px rgba(255, 90, 134, 0.7);
      transition: 0.2s ease;
    }

    .mini-label {
      color: var(--soft);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .mini-value {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }

    #stage-status {
      margin-top: 4px;
      color: #d2d2dc;
      font-size: 12px;
      line-height: 1.6;
    }

    .right-panel {
      display: flex;
    }

    .chat-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px;
      border-radius: 32px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.03)),
        rgba(0, 0, 0, 0.34);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .chat-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .chat-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .character-select {
      min-width: 146px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      outline: none;
      cursor: pointer;
    }

    .character-select option {
      background: #0d0d12;
      color: var(--text);
    }

    .chat-history {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 4px 6px 0;
    }

    .chat-history::-webkit-scrollbar {
      width: 6px;
    }

    .chat-history::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .message {
      max-width: 92%;
      padding: 14px 16px;
      border-radius: 22px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      position: relative;
      backdrop-filter: blur(10px);
    }

    .message.system {
      align-self: center;
      max-width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .message.agent {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      border-top-left-radius: 8px;
    }

    .message.user {
      align-self: flex-end;
      background: rgba(127, 87, 255, 0.18);
      border: 1px solid rgba(127, 87, 255, 0.24);
      border-top-right-radius: 8px;
    }

    .message.playable {
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .message.playable:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(127, 87, 255, 0.14);
    }

    .message.playable {
      padding-bottom: 38px;
    }

    .replay-badge {
      position: absolute;
      right: 14px;
      bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.58);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hint-row {
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .input-shell {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .input-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .icon-btn {
      border: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
    }

    #record-btn,
    #send-btn {
      width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #fff;
      font-size: 18px;
    }

    #record-btn {
      background: linear-gradient(180deg, rgba(255, 90, 134, 0.92), rgba(255, 90, 134, 0.72));
      box-shadow: 0 10px 22px rgba(255, 90, 134, 0.24);
    }

    #record-btn.recording {
      animation: pulse 1.4s infinite;
      box-shadow: 0 0 0 0 rgba(255, 90, 134, 0.56);
    }

    #send-btn {
      background: linear-gradient(180deg, rgba(127, 87, 255, 0.95), rgba(127, 87, 255, 0.72));
      box-shadow: 0 10px 22px rgba(127, 87, 255, 0.24);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 90, 134, 0.56);
      }

      70% {
        transform: scale(1.04);
        box-shadow: 0 0 0 13px rgba(255, 90, 134, 0);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 90, 134, 0);
      }
    }

    #text-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    #text-input::placeholder,
    #hint-text {
      color: var(--soft);
    }

    .persona-drawer {
      margin-top: 4px;
    }

    .persona-drawer summary {
      list-style: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .persona-drawer summary::-webkit-details-marker {
      display: none;
    }

    .persona-panel {
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }

    .persona-textarea {
      width: 100%;
      min-height: 92px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      line-height: 1.65;
      resize: vertical;
      outline: none;
    }

    .update-btn {
      width: fit-content;
      min-width: 120px;
      padding: 11px 16px;
      border: none;
      border-radius: 999px;
      background: var(--iris);
      color: #fff;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1160px) {
      html,
      body {
        overflow: auto;
      }

      .app {
        width: min(100vw - 24px, 1420px);
        height: auto;
        min-height: calc(100vh - 24px);
        margin: 12px auto;
        grid-template-columns: 1fr;
      }

      .stage-shell {
        min-height: 720px;
      }

      .chat-shell {
        min-height: 620px;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: calc(100vw - 14px);
        min-height: calc(100vh - 14px);
        margin: 7px auto;
        gap: 14px;
      }

      .stage-shell,
      .chat-shell {
        border-radius: 24px;
      }

      .stage-overlay {
        padding: 14px;
      }

      .stage-top,
      .stage-bottom,
      .chat-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .chat-controls,
      .input-row {
        width: 100%;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .character-select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <section class="left-panel">
      <div class="stage-shell">
        <div class="stage-grid"></div>
        <div class="stage-glow"></div>
        <div id="live2d-view"></div>
        <div class="stage-overlay">
          <div class="stage-top">
            <div class="glass-chip">
              <div class="status-dot" id="ws-dot"></div>
              <div>
                <div class="mini-label">link</div>
                <div class="mini-value" id="connection-label">offline</div>
              </div>
            </div>
            <div class="glass-chip overlay-right">
              <div>
                <div class="mini-label">mic</div>
                <div class="mini-value" id="mic-status">standby</div>
              </div>
            </div>
          </div>

          <div class="stage-bottom">
            <div class="stage-card overlay-right">
              <div class="mini-label" id="stage-state-value">stage</div>
              <div id="stage-status">Initializing...</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="right-panel">
      <div class="chat-shell">
        <div class="chat-head">
          <div class="chat-title">Interaction</div>
          <div class="chat-controls">
            <label class="sr-only" for="character-select">角色</label>
            <select id="character-select" class="character-select"></select>
          </div>
        </div>

        <div class="chat-history" id="chat-history">
          <div class="message system">waiting for connection</div>
        </div>

        <div class="hint-row" id="hint-text">Hold Space or press the mic</div>

        <div class="input-shell">
          <div class="input-row">
            <button id="record-btn" class="icon-btn" title="按住说话 (Space)">🎤</button>
            <input type="text" id="text-input" placeholder="输入文本或直接语音..." autocomplete="off">
            <button id="send-btn" class="icon-btn" title="发送 (Enter)">➜</button>
          </div>

          <details class="persona-drawer">
            <summary>persona</summary>
            <div class="persona-panel">
              <textarea id="persona-input" class="persona-textarea">你是一只猫娘风格的虚拟助手“赛博酱”，亲和、可爱、会倾听，但不过度卖萌。</textarea>
              <button id="update-persona-btn" class="update-btn">Update</button>
            </div>
          </details>
        </div>
      </div>
    </section>
  </div>

  <script src="/static/script.js"></script>
</body>

</html>
